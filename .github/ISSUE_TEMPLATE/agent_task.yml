name: Agent task
description: A well-scoped task an AI agent (or human) can pick up and finish in one PR to dev.
title: "[area] "
labels: []
body:
  - type: markdown
    attributes:
      value: "See [AGENTS.md](../blob/dev/AGENTS.md) and [docs/agents/](../tree/dev/docs/agents). One task = one PR to `dev`."
  - type: dropdown
    id: area
    attributes:
      label: Area / role
      options: [db, mobile/ui, marketplace, bot, social, qa, infra/ci, docs]
    validations: { required: true }
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What capability this adds and why (1–3 sentences).
    validations: { required: true }
  - type: textarea
    id: context
    attributes:
      label: Context links
      description: Epic, related issues/PRs, db-design / PRD / SSOT sections.
      placeholder: "Epic #… · Depends on #… · docs/SSOT/…"
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable checkboxes.
      value: |
        - [ ] 
        - [ ] Tests cover the new behavior
        - [ ] Definition of done in AGENTS.md met
    validations: { required: true }
  - type: input
    id: migration_range
    attributes:
      label: Migration range
      description: Claimed in docs/agents/MIGRATION_RANGES.md, e.g. 0350-0354. Use "none" if no SQL.
      placeholder: none
    validations: { required: true }
  - type: textarea
    id: files
    attributes:
      label: Files likely touched
      placeholder: "supabase/migrations/035x_*.sql\napp/apps/mobile/app/(tabs)/…"
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What this task must NOT change.
