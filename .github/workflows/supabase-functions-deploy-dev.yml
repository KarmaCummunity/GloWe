name: Supabase Functions deploy (kc-dev)

# DEV ONLY. Deploys selected Edge Functions to kc-dev. The shared
# `supabase-functions-deploy.yml` (dev + prod) stays disabled; this workflow can
# never target prod: environment is fixed to supabase-dev and the ref is checked.
on:
  workflow_dispatch:
    inputs:
      functions:
        description: 'Space-separated function names (default: store-critical + matching functions)'
        type: string
        default: 'delete-account match-rerank'
  push:
    branches: [dev]
    paths:
      - 'supabase/functions/delete-account/**'
      - 'supabase/functions/match-rerank/**'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/supabase-functions-deploy-dev.yml'

concurrency:
  group: supabase-functions-deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: functions · supabase-dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-dev
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      KC_DEV_REF: enbqriuxvvuontiwslun
      # G41: optional Sentry DSN for Edge Function error reporting (log-only when absent).
      EDGE_SENTRY_DSN: ${{ secrets.EDGE_SENTRY_DSN }}
      # match-rerank no-ops (403 for non-service callers, skipped without GEMINI_API_KEY or with
      # matching_settings.llm_rerank_enabled = false), so deploying it before the key exists is safe.
      FUNCTIONS: ${{ inputs.functions || 'delete-account match-rerank' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard – dev project only
        run: |
          set -euo pipefail
          if [ "$SUPABASE_PROJECT_REF" != "$KC_DEV_REF" ]; then
            echo "::error::supabase-dev SUPABASE_PROJECT_REF is not kc-dev; refusing."; exit 1
          fi
          for f in $FUNCTIONS; do
            [[ "$f" =~ ^[a-z0-9-]+$ ]] || { echo "::error::bad function name: $f"; exit 1; }
            test -d "supabase/functions/$f" || { echo "::error::no such function: $f"; exit 1; }
          done

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          # Keep in sync with db-deploy.yml — bump both in the same PR.
          version: 2.99.0

      - name: Deploy
        run: |
          set -euo pipefail
          for f in $FUNCTIONS; do
            supabase functions deploy "$f" --project-ref "$KC_DEV_REF" --use-api
          done

      # G41: keep kc-dev's error-reporting secrets in sync. Only the functions above were
      # redeployed, so SENTRY_RELEASE is left to the full deploy workflow.
      - name: Sync Sentry error-reporting secrets
        if: env.EDGE_SENTRY_DSN != ''
        run: |
          set -euo pipefail
          supabase secrets set SENTRY_DSN="$EDGE_SENTRY_DSN" SENTRY_ENVIRONMENT=dev --project-ref "$KC_DEV_REF"
