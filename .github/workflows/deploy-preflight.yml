name: Deploy preflight

# First stage of the deploy pipeline, called only by deploy.yml before the
# approval and before anything changes (D-195, INFRA-CI-3). Read-only: each job
# reads one GitHub Environment's secrets (a job can read only one) and fails
# closed via scripts/deploy-preflight.mjs when one is missing or points at the
# wrong project.

on:
  workflow_call:
    inputs:
      target:
        description: dev or prod
        type: string
        required: true
      sha:
        description: Commit being deployed (its scripts run the checks)
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Every Supabase secret present and pointing at the target's project; the
  # project is ACTIVE_HEALTHY; on prod the backup key is set.
  supabase:
    name: preflight · supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: supabase-${{ inputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Check Supabase secrets
        env:
          TARGET: ${{ inputs.target }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: node scripts/deploy-preflight.mjs supabase "$TARGET"

  # Cloudflare + web build settings; on prod also that `main` is the Pages
  # production branch (else the deploy would only create a preview).
  web:
    name: preflight · web
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-${{ inputs.target }}
    env:
      TARGET: ${{ inputs.target }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: karma-community
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Check web secrets and URL
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ENVIRONMENT: ${{ secrets.EXPO_PUBLIC_ENVIRONMENT }}
          WEB_URL: ${{ inputs.target == 'prod' && vars.KC_PROD_URL || vars.DEV_WEB_URL }}
        run: node scripts/deploy-preflight.mjs web "$TARGET"
      - name: Check the Pages production branch (prod)
        if: env.TARGET == 'prod'
        run: node scripts/cloudflare-pages.mjs current main
