name: CI

# The single required status check on `dev` and `main` is the `CI gate` job
# below (D-195). Every PR check lives behind it: `changes` decides which lanes
# a change needs, the lanes run as reusable workflows, and the gate fails
# unless every needed lane succeeded. Path filtering happens only inside
# scripts/ci-changes.mjs, never in `on:` — a filtered-out required context
# would hang "Expected", and a skipped one would count as passing.
#
# Rule for the reusable workflows: their jobs may only skip on an input this
# file passes. The gate sees one result per lane, so an inner job that skips
# on its own would pass unnoticed.
#
# deploy.yml triggers on this workflow by its name, `CI`: a successful push
# run on dev/main is what deploys. Renaming it stops every deploy.

on:
  pull_request:
    branches: [dev, main]
    # `edited` re-runs the gate when the title, body or base branch change, so
    # PR hygiene and the lane plan always match the current PR.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # An owner approval (or its dismissal) re-judges the gate: the test-integrity
  # guard and the ci.yml check accept a gate-weakening change only with an
  # owner approval on the head SHA (INFRA-CI-2). A review run re-runs only the
  # static lane and reuses the other lanes' results from the PR's latest
  # completed `pull_request` run for the same head SHA (scripts/ci-gate.mjs).
  # This event has no branch filter, so a review on a PR into any other branch
  # finds no such run and its gate fails closed.
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:
    types: [checks_requested]
  # Post-merge signal on the integration branches (and the main SonarCloud
  # analysis). Pushes run every lane, so a green push run certifies the whole
  # tree at that SHA (the nightly mobile builds and deploys rely on it).
  push:
    branches: [dev, main]
  workflow_dispatch:

# A PR shares one group, so a new push or edit cancels the superseded run.
# Review runs join the PR's group without cancelling: they wait for a running
# `pull_request` run, whose lane results they reuse, and a later push cancels
# them. Every other event is grouped by commit, so each dev/main push keeps its
# own result (a shared branch group would drop queued runs).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

# The change detector, the gate verdict and the test-integrity guard run from
# JUDGE_REF's copy of their scripts, never the PR's: a PR could otherwise
# weaken its own judge. For PRs, reviews and merge groups that is the base
# branch tip; pushes and dispatches already run dev/main code. ci.yml itself is
# read from the PR, so the gate compares its jobs with the base copy and fails
# on any change no owner approved (TD-202); the native backstop is the
# code-owner rule on .github/** (.github/CODEOWNERS).
env:
  JUDGE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      draft: ${{ steps.plan.outputs.draft }}
      hygiene: ${{ steps.plan.outputs.hygiene }}
      static: ${{ steps.plan.outputs.static }}
      release: ${{ steps.plan.outputs.release }}
      frontend: ${{ steps.plan.outputs.frontend }}
      backend: ${{ steps.plan.outputs.backend }}
      edge: ${{ steps.plan.outputs.edge }}
      sonar: ${{ steps.plan.outputs.sonar }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      # Full history without blobs: enough for a merge-base diff, fast to fetch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Plan lanes from the changed paths
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          # github.base_ref is empty on review events; the payload has the base.
          BASE_REF: ${{ github.base_ref || github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          # The fallback covers only a base that predates the script (bootstrap).
          if ! git show "$JUDGE_REF:scripts/ci-changes.mjs" > "$RUNNER_TEMP/ci-changes.mjs"; then
            echo "::warning::$JUDGE_REF has no scripts/ci-changes.mjs; using this commit's copy"
            cp scripts/ci-changes.mjs "$RUNNER_TEMP/ci-changes.mjs"
          fi
          node "$RUNNER_TEMP/ci-changes.mjs"

  hygiene:
    name: hygiene
    needs: changes
    if: needs.changes.outputs.hygiene == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-pr.yml

  # Cheap repo-wide guards (no install) and the test-integrity guard; run on
  # every non-draft change and on review events. `pull-requests: read` lets
  # the integrity guard read owner approvals.
  static:
    name: static
    needs: changes
    if: needs.changes.outputs.static == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-static-guards.yml

  # dev → main releases only: source branch, strict migration scan, VERSION
  # bump, and the dev E2E once dev serves the release head.
  release:
    name: release
    needs: changes
    if: needs.changes.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci-release.yml

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-frontend.yml
    with:
      sonar: ${{ needs.changes.outputs.sonar == 'true' }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-backend.yml

  edge:
    name: edge
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci-edge-functions.yml

  # The only required status check. `always()` makes it report even when a
  # lane fails or is cancelled; scripts/ci-gate.mjs turns that into a verdict.
  # Every other job in this file must be a known lane listed in `needs:`
  # (enforced by scripts/check-required-checks-drift.mjs). Read access to PRs
  # and Actions lets the judge read owner approvals and, on review events, the
  # lane results of the PR's latest `pull_request` run.
  gate:
    name: CI gate
    needs: [changes, hygiene, static, release, frontend, backend, edge]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      # History without blobs: the judge modules and ci.yml are read at
      # JUDGE_REF, and the PR's own ci.yml change is diffed from the merge-base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            scripts/ci-gate.mjs
            scripts/ci-changes.mjs
            scripts/ci-github.mjs
            scripts/ci-workflow-diff.mjs
            scripts/check-required-checks-drift.mjs
          sparse-checkout-cone-mode: false
      - name: Evaluate lane results
        env:
          NEEDS: ${{ toJSON(needs) }}
          PLAN: ${{ needs.changes.outputs.plan }}
          DRAFT: ${{ needs.changes.outputs.draft }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Every judge module comes from the base commit, so a PR cannot edit
          # what judges it. The fallback covers only a base that predates a
          # module (bootstrap).
          judge="$RUNNER_TEMP/judge"
          mkdir -p "$judge"
          for f in ci-gate.mjs ci-changes.mjs ci-github.mjs ci-workflow-diff.mjs check-required-checks-drift.mjs; do
            if ! git show "$JUDGE_REF:scripts/$f" > "$judge/$f"; then
              echo "::warning::$JUDGE_REF has no scripts/$f; using this commit's copy"
              cp "scripts/$f" "$judge/$f"
            fi
          done
          node "$judge/ci-gate.mjs"
