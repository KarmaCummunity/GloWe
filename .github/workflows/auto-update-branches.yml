name: Auto-update PR branches

# After every push to `dev`, brings each open auto-merge PR into `dev` up to date.
# Branch protection requires PRs to be current with `dev`, so without this every
# merge leaves all other PRs "behind" and they never merge on their own.
#
# Identity (INFRA-CI-6, TD-197): the update is pushed with the agent GitHub App
# token (AGENT_APP_ID + AGENT_APP_PRIVATE_KEY), or else AGENT_MERGE_TOKEN —
# never GITHUB_TOKEN, whose pushes trigger no CI, so the required checks would
# never run on the new head and the PR would stay stuck (or show the old
# head's results). The credentials are secrets of the `agent-merge`
# environment, which only `dev` may use (TD-223). The App token has no
# `workflows` permission, so a PR that is behind a `dev` change to
# .github/workflows cannot be updated here and is reported as skipped.

on:
  push:
    branches: [dev]
  workflow_dispatch:

# GITHUB_TOKEN gets no scopes: every API call uses the minted or stored token.
permissions: {}

# One run at a time, queued runs collapse into the latest: only the newest dev head matters.
concurrency:
  group: auto-update-branches
  cancel-in-progress: true

jobs:
  update:
    name: update behind PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: agent-merge
    permissions: {}
    steps:
      # Step `if:` cannot read secrets, so this step turns "are the App
      # credentials configured?" into an output.
      - name: Detect the agent App credentials
        id: identity
        env:
          APP_ID: ${{ secrets.AGENT_APP_ID }}
          APP_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

      # Installation token for this repository: read PRs, push merge commits.
      - name: Mint agent GitHub App token
        id: app
        if: steps.identity.outputs.app == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Update branches of auto-merge PRs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.AGENT_MERGE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::No agent identity: set AGENT_APP_ID + AGENT_APP_PRIVATE_KEY or AGENT_MERGE_TOKEN in the agent-merge environment (TD-197)"
            exit 1
          fi
          # Only ready PRs with auto-merge armed and a branch inside this repo (forks can't be updated).
          prs=$(gh pr list --repo "$REPO" --base dev --state open --limit 100 \
            --json number,autoMergeRequest,isCrossRepository,isDraft \
            --jq '.[] | select(.autoMergeRequest != null and (.isCrossRepository | not) and (.isDraft | not)) | .number')
          for pr in $prs; do
            # "behind" is not exposed by `gh pr list`; the update call is a no-op when already current.
            gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" --silent \
              && echo "updated #$pr" \
              || echo "skipped #$pr (conflict, already current, or behind a workflow change)"
          done
