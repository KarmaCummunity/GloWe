name: CI — E2E dev

# P0 user journeys against the live dev deployment (D-55).
# Gates production release PRs (dev → main). Targets kc-dev with the public seed users
# (tests/e2e/lib/env.ts); only DEV_WEB_URL is required.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/**'
      - 'tests/e2e/**'
      - 'scripts/wait-for-url.mjs'
      - 'scripts/ensure-e2e-user.mjs'
      - '.github/workflows/ci-e2e-dev.yml'
  workflow_dispatch:

concurrency:
  group: ci-e2e-dev-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  user-journeys:
    name: user journeys (P0)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require DEV_WEB_URL
        env:
          DEV_WEB_URL: ${{ vars.DEV_WEB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DEV_WEB_URL}" ]; then
            echo "::error::Repository variable DEV_WEB_URL is not set."
            echo "GitHub → Settings → Secrets and variables → Actions → Variables"
            echo "DEV_WEB_URL = https://mvp-2-dev.up.railway.app"
            exit 1
          fi
          echo "Target: ${DEV_WEB_URL}"

      - name: Wait for dev deployment
        env:
          DEV_WEB_URL: ${{ vars.DEV_WEB_URL }}
        run: node scripts/wait-for-url.mjs "${DEV_WEB_URL%/}/" 12 15000

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run P0 journeys
        working-directory: tests/e2e
        env:
          DEV_WEB_URL: ${{ vars.DEV_WEB_URL }}
        run: npm test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
