# Sync main → dev after a release.
#
# Releases are squash-merged (repo allows squash only), so every release leaves
# one commit on main that dev's history lacks; without syncing, the NEXT
# dev → main PR conflicts. dev is protected (PR + required checks), so this
# workflow can't push to dev directly (that is why the old direct-push version
# failed). Instead it opens a zero-diff PR: dev + `git merge -s ours main`.
# Because main's tree is always a snapshot of dev, `-s ours` loses nothing.
#
# The PR MUST land as a MERGE COMMIT (a squash would drop the ancestry):
# temporarily enable "Allow merge commits", merge, disable again. See
# docs/SSOT/RELEASE_CHECKLIST.md → "Immediately after squash-merge to main".

name: Sync main → dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Open ancestry-only sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "dev already contains main; nothing to sync."; exit 0
          fi
          short=$(git rev-parse --short origin/main)
          branch="sync/main-into-dev-$short"
          git checkout -b "$branch"
          git merge -s ours --no-edit origin/main -m "chore: sync main ($short) into dev (ancestry only)"
          if ! git diff --quiet origin/dev HEAD; then
            echo "::error::-s ours merge unexpectedly changed files"; exit 1
          fi
          git push -f origin "$branch"
          if gh pr list --head "$branch" --state open --json number -q '.[0].number' | grep -q .; then
            echo "Sync PR already open."; exit 0
          fi
          gh pr create --base dev --head "$branch" \
            --title "chore: sync main ($short) into dev (ancestry only)" \
            --body "Mapped to spec: INFRA/release. Zero-diff \`-s ours\` merge of main into dev so the next release PR doesn't conflict. **Merge as a merge commit** (temporarily allow merge commits), not squash."
