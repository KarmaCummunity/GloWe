# SonarCloud — fail PRs when Quality Gate fails on new code.
# Requires repo/org secret SONAR_TOKEN (SonarCloud user token).
# See docs/dev/SONAR.md for setup, waivers, and branch protection.
#
# `SonarCloud quality gate` is a REQUIRED status check on dev/main (branch
# protection) — keep the job name stable. Because it is required, the
# pull_request trigger runs on every non-draft PR (no path filter): the gate
# context is posted by the SonarCloud scan, so the scan must run for the context
# to report. Path-filtering it left the required context permanently "Expected"
# on backend-only / docs-only PRs and blocked their merge (same fix as
# ci-backend.yml / ci-contract.yml / ci-frontend.yml). A PR with no new code
# passes the gate trivially.

name: CI — SonarCloud

on:
  push:
    # SonarCloud free plan analyses the main branch only; dev is covered by PR scans.
    branches: [main]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # Dependabot PRs cannot read repo secrets (SONAR_TOKEN), so the scan cannot
  # run. Dependency bumps add no first-party code; report the required context
  # as passing so they are gated by the regular typecheck/test/lint checks.
  sonarcloud-dependabot:
    name: SonarCloud quality gate
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Dependabot PR - SonarCloud skipped (no secret access)."

  sonarcloud:
    name: SonarCloud quality gate
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require SONAR_TOKEN
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "::error::Missing SONAR_TOKEN repository/org secret. See docs/dev/SONAR.md"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm + Turbo cache
        uses: ./.github/actions/setup-pnpm-turbo

      - name: Install dependencies
        working-directory: app
        env:
          TURBO_TELEMETRY_DISABLED: '1'
        run: pnpm install --frozen-lockfile

      - name: Generate coverage (vitest lcov per package)
        working-directory: app
        env:
          TURBO_TELEMETRY_DISABLED: '1'
        run: pnpm test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
