name: CI — SonarCloud

# SonarCloud quality gate on new code, called by ci-frontend.yml after the
# tests job. It scans with that job's `coverage` artifact instead of
# re-running the test suite. ci.yml enables it for PRs into `main` and pushes
# to `main` only: the free plan analyses only `main` and pull requests, so
# merge groups and dev pushes cannot be scanned, and PRs into dev get fast
# feedback only (D-195 addendum, TD-236). Dependabot runs get no secrets.
# Setup, waivers: docs/dev/SONAR.md.

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Missing SONAR_TOKEN repository/org secret. See docs/dev/SONAR.md"
            exit 1
          fi

      # Full history: Sonar uses blame to tell new code from old.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The artifact root is `app/`, so this restores the lcov paths that
      # sonar-project.properties lists.
      - name: Download coverage from the tests job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: app

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
