name: CI — frontend

# Frontend lane, called by ci.yml when app/** or a build input changed
# (scripts/ci-changes.mjs). checks, tests, web and native run in parallel;
# sonar starts as soon as tests finish, which keeps it off the critical path:
#   • checks — typecheck, ESLint, dependency audit.
#   • tests  — unit tests with coverage; the coverage artifact feeds the
#     SonarCloud scan (no second test run).
#   • web    — production web export, bundle budget, headless smoke load.
#   • native — Metro bundles for iOS + Android, so a module that cannot
#     resolve or compile for native fails here instead of in TestFlight/Play.
#   • sonar  — SonarCloud quality gate on the tests job's coverage.
# Jobs skip only on the `sonar` input (ci.yml's gate sees one lane result).

on:
  workflow_call:
    inputs:
      sonar:
        description: Run the SonarCloud quality gate (false for Dependabot, merge queue, dev pushes).
        type: boolean
        required: true
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  tests:
    name: unit tests · coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the brand guard's touched-file rule diffs against the PR base (spec 17 §6).
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm-turbo

      - run: pnpm install --frozen-lockfile

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage for SonarCloud
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          overwrite: true
          retention-days: 3
          path: |
            app/packages/domain/coverage/
            app/packages/application/coverage/
            app/packages/infrastructure-supabase/coverage/
            app/packages/ui/coverage/
            app/apps/mobile/coverage/

  checks:
    name: typecheck · lint · audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm-turbo

      - run: pnpm install --frozen-lockfile

      # ESLint only: the architecture, SSOT-link and Hebrew guards that
      # `pnpm lint` also chains run in the static-guards lane. Turbo runs each
      # package's typecheck before its lint, so typecheck runs once.
      - name: Typecheck + ESLint (per-package --max-warnings ratchet)
        run: pnpm exec turbo run typecheck lint

      - name: Dependency audit
        if: ${{ !cancelled() }}
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          # The legacy npm audit endpoint is being retired and returns HTTP 410
          # (ERR_PNPM_AUDIT_BAD_RESPONSE), and the audit can exhaust the Node
          # heap; both are registry/infra errors, not advisories, so they warn.
          # Genuine high-severity advisories still fail the job.
          set +e
          out="$(pnpm audit --audit-level=high 2>&1)"
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ] && echo "$out" | grep -q "ERR_PNPM_AUDIT_BAD_RESPONSE"; then
            echo "::warning::pnpm audit registry endpoint unavailable (HTTP 410, retired) — dependency audit skipped"
            exit 0
          fi
          if [ "$code" -ne 0 ] && { [ "$code" -eq 134 ] || echo "$out" | grep -q "JavaScript heap out of memory"; }; then
            echo "::warning::pnpm audit exceeded Node heap — dependency audit skipped (infra)"
            exit 0
          fi
          exit "$code"

  sonar:
    name: sonar
    needs: tests
    if: inputs.sonar
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  web:
    name: web export · budget · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    env:
      # Production-shaped public env (same wiring as the Dockerfile builder);
      # the anon key is a placeholder — the bundle is built, never served.
      EXPO_PUBLIC_ENVIRONMENT: production
      EXPO_PUBLIC_SUPABASE_URL: https://enbqriuxvvuontiwslun.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-web-build-placeholder-not-for-runtime
      # Pinned so the smoke step is deterministic; browser binaries are cached
      # under this key. Bump deliberately (cache key rolls with it).
      PLAYWRIGHT_VERSION: 1.60.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm-turbo

      - run: pnpm install --frozen-lockfile

      - name: Build web bundle (same env wiring as Dockerfile)
        run: pnpm build:web

      - name: Verify dist output
        run: test -f apps/mobile/dist/index.html && test -f apps/mobile/dist/_headers

      # Reads the export above; fails if the bundle is missing or over budget.
      - name: Web bundle gzip budget (#901)
        run: |
          KC_MOBILE_WEB_BUNDLE_BUDGET_KB=$(node -p "require('./perf-budgets.json').mobileWebMainBundleGzipKb") \
            node scripts/check-mobile-bundle-budget.mjs

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright (Chromium only)
        working-directory: ${{ github.workspace }}
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          npm init -y --silent
          npm install --no-save --silent "playwright@${PLAYWRIGHT_VERSION}"
          if [ "$CACHE_HIT" = "true" ]; then
            # Browser binaries restored from cache — only OS deps needed.
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Smoke-load web bundle (headless Chromium)
        working-directory: ${{ github.workspace }}
        run: node scripts/smoke-web-bundle.mjs --dist app/apps/mobile/dist

  native:
    name: native bundle (iOS + Android)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    env:
      # Same production-shaped public env as the web job.
      EXPO_PUBLIC_ENVIRONMENT: production
      EXPO_PUBLIC_SUPABASE_URL: https://enbqriuxvvuontiwslun.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-web-build-placeholder-not-for-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm-turbo

      - run: pnpm install --frozen-lockfile

      # Metro + Hermes bytecode for both native platforms, exactly what EAS
      # embeds in a store build; no native compile, so it runs on Linux.
      - name: Bundle iOS and Android JS (expo export)
        run: pnpm --filter @kc/mobile exec expo export --platform ios --platform android --output-dir dist-native

      - name: Verify both platform bundles exist
        working-directory: app/apps/mobile/dist-native
        run: |
          for platform in ios android; do
            if ! find "_expo/static/js/$platform" -name '*.hbc' -o -name '*.js' | grep -q .; then
              echo "::error::no $platform bundle under dist-native/_expo/static/js/$platform"
              exit 1
            fi
          done
