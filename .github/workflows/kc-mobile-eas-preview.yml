# Internal EAS builds (preview profile) without store submit — manual smoke for mobile.
# Cloud builds take EXPO_PUBLIC_* from the eas.json "preview" profile and the EAS
# "preview" environment; the runner's env never reaches the EAS builder.
# Required secret: EXPO_TOKEN (fails closed when unset).
name: KC mobile — EAS preview build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        type: choice
        options:
          - all
          - ios
          - android
        default: all

concurrency:
  group: kc-mobile-eas-preview
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same eas-cli pin in testflight-ios.yml and play-internal.yml; bump all three together.
  EAS_CLI_VERSION: 24.12.1

jobs:
  preview:
    name: EAS preview build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app/apps/mobile

    steps:
      - name: Preflight EXPO_TOKEN (fail closed)
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::EAS preview build cannot run — missing secret: EXPO_TOKEN"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g "eas-cli@$EAS_CLI_VERSION" --ignore-scripts

      - name: EAS build (preview profile)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          eas build \
            --platform "$PLATFORM" \
            --profile preview \
            --non-interactive \
            --wait
