name: Auto-merge PRs

# Enables squash auto-merge on every non-draft PR into `dev` (no label needed).
# Draft PRs are the opt-out: convert to ready to enter the merge flow.
# GitHub then merges by itself once the branch protection's required checks pass.
# Never touches `main`. Docs: docs/agents/OPERATING_MODEL.md.
# Safe as pull_request_target: no checkout, and no PR code runs.
# Same-repo heads only: only collaborators with write access can push to them,
# so a label applied once cannot carry later commits from a fork.

on:
  pull_request_target:
    branches: [dev]
    types: [labeled, opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    name: enable auto-merge (squash)
    if: >-
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge
        env:
          # Optional AGENT_MERGE_TOKEN (fine-grained PAT or App token) lets the
          # merge push trigger DB deploy / Deploy Web. A merge done with
          # GITHUB_TOKEN does not trigger downstream workflows.
          GH_TOKEN: ${{ secrets.AGENT_MERGE_TOKEN || github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR" --repo "$REPO" --auto --squash --delete-branch
