name: Auto-merge PRs

# Enables squash auto-merge on every non-draft PR into `dev` (no label needed).
# Draft PRs are the opt-out: convert to ready to enter the merge flow.
# GitHub then merges by itself once the dev ruleset is satisfied (`CI verdict`
# and `CI gate` green, plus the owner's code-owner approval when the PR touches
# a gate-critical path). Never touches `main`. Docs: docs/agents/OPERATING_MODEL.md.
# Safe as pull_request_target: no checkout, and no PR code runs.
# Same-repo heads only: only collaborators with write access can push to them.
#
# Identity (INFRA-CI-6, TD-197): auto-merge is enabled with a token of the
# agent GitHub App (AGENT_APP_ID + AGENT_APP_PRIVATE_KEY), or else
# AGENT_MERGE_TOKEN. The merge GitHub performs later is attributed to that
# identity, so its push to `dev` triggers the push workflows (CI → Deploy,
# close-issues-on-dev-merge). GITHUB_TOKEN is never
# used: its pushes start no workflows, so a merge made with it would skip push
# CI and every deploy without any error. With no credential the job fails.
#
# Default branch only ({{TD:pull-request-target-main-only}}): since 2025-12-08 GitHub runs pull_request_target
# from the DEFAULT branch (`main`): this file's `main` copy is the one that runs
# (the `dev` copy is ignored), GITHUB_REF is refs/heads/main, and environment
# branch policies are checked against `main`. Changes here take effect only once
# they reach `main`.
#
# The credentials are secrets of the `agent-merge` environment, whose
# deployment-branch policy must allow only `main` (like `ci-verdict`). Only
# code on `main` reaches them, and every change to `main` needs the owner's
# approval. A workflow an agent pushes on any other branch, `dev` included,
# cannot read them (TD-223). A policy that allows only `dev` fails this job
# with an environment protection error.

on:
  pull_request_target:
    branches: [dev]
    # `edited` covers a retarget: a stacked PR whose base branch was just merged and
    # deleted is moved onto `dev` by GitHub, and must then get auto-merge armed.
    types: [labeled, opened, reopened, synchronize, ready_for_review, edited]

# GITHUB_TOKEN gets no scopes: every API call uses the minted or stored token.
permissions: {}

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    name: enable auto-merge (squash)
    if: >-
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: agent-merge
    permissions: {}
    steps:
      # Step `if:` cannot read secrets, so this step turns "are the App
      # credentials configured?" into an output.
      - name: Detect the agent App credentials
        id: identity
        env:
          APP_ID: ${{ secrets.AGENT_APP_ID }}
          APP_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

      # Installation token scoped to this repository and to what enabling
      # auto-merge and deleting the head branch need. It expires within an
      # hour and the action revokes it when the job ends.
      - name: Mint agent GitHub App token
        id: app
        if: steps.identity.outputs.app == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.AGENT_MERGE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # No --delete-branch: GitHub rejects it while the `dev` merge queue is enabled
        # ("Cannot use -d or --delete-branch when merge queue enabled"); the queue's
        # merge removes the head branch per the repository's delete-on-merge setting.
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::No agent merge identity: set AGENT_APP_ID + AGENT_APP_PRIVATE_KEY (GitHub App, preferred) or AGENT_MERGE_TOKEN in the agent-merge environment (deployment branch main). GITHUB_TOKEN is not used because a merge made with it triggers no push CI and no deploy (TD-197). See docs/SSOT/OPERATOR_RUNBOOK.md § Owner setup for D-195 CI/CD."
            exit 1
          fi
          gh pr merge "$PR" --repo "$REPO" --auto --squash
