name: CI — Edge Functions

# Edge Functions lane, called by ci.yml when supabase/** or CI plumbing
# changed. Works on the whole supabase/functions tree, so a new function or
# test file is covered without editing this workflow.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deno:
    name: deno check · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Exact Deno pin: a floating 2.x could add lint rules or tighten type
      # checks between runs. Remote modules are cached per source hash.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.5.6
          cache: true
          cache-hash: ${{ hashFiles('supabase/functions/**/*.ts') }}

      - name: Type-check every function, shared module and test
        run: deno check .

      - name: Lint (deno recommended rules)
        if: ${{ !cancelled() }}
        run: deno lint

      # Handlers are tested with mocked I/O; no secrets or network needed.
      - name: Run every *.test.ts
        if: ${{ !cancelled() }}
        run: deno test --allow-read
