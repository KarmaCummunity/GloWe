name: Deploy Web → Cloudflare Pages

# Web stage of the deploy pipeline (D-195, INFRA-CI-3). Called only by
# deploy.yml, after the DB and Edge Functions stages; no push or manual
# trigger (to redeploy dev, dispatch the Deploy workflow on `dev`).
#
# Builds the KC web export of exactly `inputs.sha` and uploads it to the
# Cloudflare Pages project `karma-community`: target dev → branch `dev`
# (https://dev.karma-community.pages.dev), target prod → branch `main`, the
# project's production branch (https://karma-community-kc.com). The build
# stamps /version.json with that SHA (app/scripts/web-version.mjs), which the
# deploy smoke then waits for.
#
# Environment cloudflare-<target> (no reviewers): CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID, EXPO_PUBLIC_SUPABASE_URL,
# EXPO_PUBLIC_SUPABASE_ANON_KEY, EXPO_PUBLIC_ENVIRONMENT.

on:
  workflow_call:
    inputs:
      target:
        description: dev or prod
        type: string
        required: true
      sha:
        description: Exact commit to build and deploy
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: web · ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-${{ inputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # EXPO_PUBLIC_GIT_COMMIT_SHA stamps the deployed commit into the bundle
      # and /version.json; GITHUB_SHA here is the default branch tip.
      - name: Build web
        working-directory: app
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ENVIRONMENT: ${{ secrets.EXPO_PUBLIC_ENVIRONMENT }}
          EXPO_PUBLIC_GIT_COMMIT_SHA: ${{ inputs.sha }}
        run: pnpm build:web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy app/apps/mobile/dist
            --project-name=karma-community
            --branch=${{ inputs.target == 'prod' && 'main' || 'dev' }}
            --commit-hash=${{ inputs.sha }}
