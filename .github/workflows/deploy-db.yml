name: DB deploy

# Database stage of the deploy pipeline (D-195, INFRA-CI-3). Called by
# deploy.yml after preflight (and, for prod, after the owner's approval); it
# never runs on push. Two jobs:
#
#   backup   prod only: an encrypted `supabase db dump` (schema + data) taken
#            before migrating, when supabase/migrations changed since the last
#            release tag. Stored as a 14-day workflow artifact for a manual
#            restore (docs/SSOT/OPERATOR_RUNBOOK.md "Restore a pre-migration
#            backup"). DB changes are forward-fix only; nothing restores
#            automatically.
#   migrate  dry-run, then apply pending migrations. On prod `db push` runs
#            WITHOUT --include-all, so the CLI refuses when the remote has a
#            version with no local file (remote ahead) or a local migration
#            sorts before the last applied one (out of order) instead of
#            applying it silently. Dev keeps --include-all.
#
# Manual escape hatch: workflow_dispatch from the `dev` ref only, target fixed
# to dev, dry-run unless `apply` is ticked. Prod migrations run only through
# deploy.yml (CI-gated, one approval).
#
# Secrets come from the job's GitHub Environment (supabase-dev / supabase-prod;
# neither has reviewers — the approval click lives on `production`):
# SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF, and on
# prod the variable BACKUP_AGE_RECIPIENT. scripts/deploy-preflight.mjs checks
# them and pins the project ref per target.

on:
  workflow_call:
    inputs:
      target:
        description: dev or prod
        type: string
        required: true
      sha:
        description: Exact commit to deploy
        type: string
        required: true
  workflow_dispatch:
    inputs:
      apply:
        description: Apply pending migrations to kc-dev (unticked = dry-run only)
        type: boolean
        default: false

permissions:
  contents: read

env:
  # A dispatch has no target/sha inputs: it is always dev at the dispatched ref.
  TARGET: ${{ inputs.target || 'dev' }}
  SHA: ${{ inputs.sha || github.sha }}
  # Called runs always apply; a dispatch applies only when asked.
  APPLY: ${{ inputs.sha != '' || inputs.apply }}

jobs:
  backup:
    name: backup (prod)
    if: inputs.target == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: supabase-prod
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      # Full history + tags: the diff against the last release tag needs both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Preflight (fails closed without the backup key)
        run: node scripts/deploy-preflight.mjs supabase prod

      - name: Did migrations change since the last release?
        id: changed
        run: |
          set -euo pipefail
          node scripts/release-version.mjs latest > "$RUNNER_TEMP/latest"
          last_sha=$(sed -n 's/^sha=//p' "$RUNNER_TEMP/latest")
          if [ -z "$last_sha" ]; then
            echo "No release tag yet; backing up."
            echo "dump=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$last_sha" "$SHA" -- supabase/migrations; then
            echo "No migration changes since $last_sha; no backup needed."
            echo "dump=false" >> "$GITHUB_OUTPUT"
          else
            echo "dump=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-supabase-cli
        if: steps.changed.outputs.dump == 'true'

      - name: Install age
        if: steps.changed.outputs.dump == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age >/dev/null

      # The dump streams straight into age, so plaintext (PII) never touches
      # the disk or the log; only ciphertext is written and uploaded.
      - name: Dump schema and data, encrypted
        if: steps.changed.outputs.dump == 'true'
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes >/dev/null
          mkdir -p "$RUNNER_TEMP/backup"
          supabase db dump --linked | age -r "$BACKUP_AGE_RECIPIENT" -o "$RUNNER_TEMP/backup/schema.sql.age"
          supabase db dump --linked --data-only --use-copy | age -r "$BACKUP_AGE_RECIPIENT" -o "$RUNNER_TEMP/backup/data.sql.age"
          for f in "$RUNNER_TEMP"/backup/*.age; do
            test -s "$f" || { echo "::error::empty backup file $(basename "$f")"; exit 1; }
          done
          ls -l "$RUNNER_TEMP/backup"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.changed.outputs.dump == 'true'
        with:
          name: prod-db-backup-${{ inputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backup/
          retention-days: 14
          if-no-files-found: error

  migrate:
    name: migrations · ${{ inputs.target || 'dev' }}
    needs: backup
    # `backup` is skipped on dev and must succeed on prod.
    if: ${{ !cancelled() && (needs.backup.result == 'success' || (needs.backup.result == 'skipped' && inputs.target != 'prod')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: supabase-${{ inputs.target || 'dev' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Manual runs are dev-only, from the dev ref
        if: inputs.sha == ''
        run: |
          if [ "$GITHUB_REF" != refs/heads/dev ]; then
            echo "::error::Dispatch DB deploy from the dev ref; prod migrates only through the Deploy workflow."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      # Repeated here because a dispatch skips deploy.yml's preflight.
      - name: Preflight (secrets present, project ref matches the target)
        run: node scripts/deploy-preflight.mjs supabase "$TARGET"

      - uses: ./.github/actions/setup-supabase-cli

      - name: Link to remote project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: List local vs remote migrations
        run: supabase migration list --linked --yes

      # Prod omits --include-all so out-of-order or remote-ahead histories fail
      # here, before anything is applied.
      - name: Dry-run push
        run: |
          set -euo pipefail
          flags=(--linked --yes)
          if [ "$TARGET" = dev ]; then flags+=(--include-all); fi
          supabase db push --dry-run "${flags[@]}"

      - name: Apply migrations
        if: env.APPLY == 'true'
        run: |
          set -euo pipefail
          flags=(--linked --yes)
          if [ "$TARGET" = dev ]; then flags+=(--include-all); fi
          supabase db push "${flags[@]}"
