# Manual Google Play internal-track upload (ported from KupaPay): EAS cloud AAB + `eas submit`.
# Never promotes beyond the internal track.
# Secrets (names only): EXPO_TOKEN, GOOGLE_PLAY_SERVICE_ACCOUNT_JSON. Variable: KC_EAS_PROJECT_ID.
# NOTE: the AAB builds on EAS cloud, so EXPO_PUBLIC_* and SENTRY_AUTH_TOKEN must also exist as EAS env vars (production).
# Skips cleanly (green, with a notice) when any required secret/variable is unset. Optional: SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_URL.
name: Play Internal Android

on:
  workflow_dispatch:

concurrency:
  group: play-internal-android
  cancel-in-progress: true

permissions:
  contents: read

env:
  PACKAGE_NAME: org.karmacommunity.app

jobs:
  play-internal:
    name: Build AAB & submit to Play internal
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app/apps/mobile
    steps:
      - name: Preflight secrets (skip cleanly when unset)
        id: preflight
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          KC_EAS_PROJECT_ID: ${{ vars.KC_EAS_PROJECT_ID }}
        run: |
          set -euo pipefail
          missing=()
          for n in EXPO_TOKEN GOOGLE_PLAY_SERVICE_ACCOUNT_JSON KC_EAS_PROJECT_ID; do
            [ -n "${!n:-}" ] || missing+=("$n")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Play internal — missing secrets/variables: ${missing[*]}"
            exit 0
          fi
          if ! printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" | jq -e '.type == "service_account" and (.client_email|length>0)' >/dev/null; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not a valid service account JSON"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "All Play internal secrets present."

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.ready == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v7
        if: steps.preflight.outputs.ready == 'true'
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.preflight.outputs.ready == 'true'
        working-directory: app
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install EAS CLI
        if: steps.preflight.outputs.ready == 'true'
        run: npm install -g eas-cli@24.12.1 --ignore-scripts

      - name: Verify Android package
        if: steps.preflight.outputs.ready == 'true'
        run: |
          set -euo pipefail
          actual="$(npx --yes expo config --json --type public | jq -r '.android.package')"
          if [ "$actual" != "$PACKAGE_NAME" ]; then
            echo "::error::Android package is '$actual', expected '$PACKAGE_NAME'"
            exit 1
          fi

      - name: Write Play service account key (runner temp, never committed)
        if: steps.preflight.outputs.ready == 'true'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          # Path must match eas.json submit.production.android.serviceAccountKeyPath (gitignored).
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > ./google-play-service-account.json

      - name: Build AAB on EAS & submit to Play internal
        if: steps.preflight.outputs.ready == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.KC_EAS_PROJECT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
        run: |
          set -euo pipefail
          [ -n "${SENTRY_AUTH_TOKEN:-}" ] || export SENTRY_DISABLE_AUTO_UPLOAD=true
          eas build --platform android --profile production --non-interactive --wait --json > build.json
          url="$(jq -r '.[0].artifacts.buildUrl // empty' build.json)"
          [ -n "$url" ] || { echo "::error::No AAB artifact URL from EAS"; exit 1; }
          eas submit --platform android --profile production --url "$url" --non-interactive
          v="$(eas build:version:get -p android 2>/dev/null | grep -oE '[0-9]+$' || true)"
          [ -n "$v" ] || { echo "::error::Could not read EAS remote Android versionCode"; exit 1; }
          echo "EAS remote Android versionCode: $v"

      - name: Remove key file
        if: always() && steps.preflight.outputs.ready == 'true'
        run: rm -f ./google-play-service-account.json
