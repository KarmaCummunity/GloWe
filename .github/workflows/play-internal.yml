# Google Play internal-track upload: EAS cloud AAB + `eas submit`. Never promotes
# beyond the internal track (eas.json submits a draft with changesNotSentForReview).
#
# Callers: the nightly pipeline (mobile-nightly.yml, `workflow_call` with the
# green SHA) and manual dispatch on dev. The commit built must have a successful
# `CI` push run on dev (D-195 "Mobile nightly"). Tester builds use the eas.json
# `nightly` profile and the kc-dev Supabase backend; store builds from main
# (prod backend) are not wired yet, and scripts/mobile-store-config.mjs refuses them.
#
# Runs in the `mobile-store` GitHub Environment (deployment branches: dev, main).
# Required, fail closed when unset:
#   secrets  EXPO_TOKEN, GOOGLE_PLAY_SERVICE_ACCOUNT_JSON,
#            MOBILE_SUPABASE_ANON_KEY (kc-dev publishable key, mobile-store environment)
#   vars     KC_EAS_PROJECT_ID
# The AAB builds on EAS cloud, where the runner env never arrives: Sentry and
# FCM config (SENTRY_*, EXPO_PUBLIC_SENTRY_DSN, GOOGLE_SERVICES_JSON) come from
# the EAS "preview" environment that the `nightly` profile selects.
name: Play Internal Android

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to build (must have a successful CI push run on dev)
        type: string
        required: true
    outputs:
      version_code:
        description: Android versionCode of the submitted AAB
        value: ${{ jobs.play-internal.outputs.version_code }}
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_NAME: org.karmacommunity.app
  # Same eas-cli pin in testflight-ios.yml and kc-mobile-eas-preview.yml; bump all three together.
  EAS_CLI_VERSION: 24.12.1

jobs:
  play-internal:
    name: Build AAB & submit to Play internal
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: mobile-store
    permissions:
      contents: read
      actions: read # read CI runs to verify the commit is green
    # Never cancel an in-flight build: it has already consumed an EAS
    # versionCode. The group is per caller (`github.workflow` is the caller's
    # name in a called run), so queued manual runs can only displace each
    # other, never a nightly run, which mobile-nightly.yml already serialises.
    concurrency:
      group: play-internal-android-${{ github.workflow }}
      cancel-in-progress: false
    outputs:
      version_code: ${{ steps.build.outputs.version_code }}
    defaults:
      run:
        working-directory: app/apps/mobile
    steps:
      - name: Verify the commit passed CI on dev
        id: target
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A dispatch builds the dispatched ref's head; a nightly call passes its green SHA.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/dev" ]; then
            echo "::error::Manual Play internal runs are allowed only on dev (got $GITHUB_REF)."
            exit 1
          fi
          sha="${INPUT_REF:-$GITHUB_SHA}"
          # Branches with a green push run for this commit; main wins so that
          # mobile-store-config.mjs refuses it (prod store builds are not wired).
          branches="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=success" \
            --jq '[.workflow_runs[].head_branch | select(. == "dev" or . == "main")] | unique | join(" ")')"
          case " $branches " in
            *" main "*) branch=main ;;
            *" dev "*) branch=dev ;;
            *) echo "::error::$sha has no successful CI push run on dev; refusing to build it."; exit 1 ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Preflight secrets (fail closed)
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          MOBILE_SUPABASE_ANON_KEY: ${{ secrets.MOBILE_SUPABASE_ANON_KEY }}
          KC_EAS_PROJECT_ID: ${{ vars.KC_EAS_PROJECT_ID }}
        run: |
          set -euo pipefail
          missing=()
          for n in EXPO_TOKEN GOOGLE_PLAY_SERVICE_ACCOUNT_JSON MOBILE_SUPABASE_ANON_KEY KC_EAS_PROJECT_ID; do
            [ -n "${!n:-}" ] || missing+=("$n")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Play internal cannot run — missing secrets/variables (repo or mobile-store environment): ${missing[*]}"
            exit 1
          fi
          if ! printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" | jq -e '.type == "service_account" and (.client_email|length>0)' >/dev/null; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not a valid service account JSON"
            exit 1
          fi
          echo "All Play internal secrets present."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # Writes the kc-dev backend into the eas.json `nightly` profile env (runner
      # only); fails for a main commit or a key of another project.
      - name: Pin the Supabase backend
        working-directory: .
        env:
          SOURCE_BRANCH: ${{ steps.target.outputs.branch }}
          MOBILE_SUPABASE_ANON_KEY: ${{ secrets.MOBILE_SUPABASE_ANON_KEY }}
        run: node scripts/mobile-store-config.mjs pin

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install EAS CLI
        run: npm install -g "eas-cli@$EAS_CLI_VERSION" --ignore-scripts

      - name: Verify Android package
        run: |
          set -euo pipefail
          actual="$(npx --yes expo config --json --type public | jq -r '.android.package')"
          if [ "$actual" != "$PACKAGE_NAME" ]; then
            echo "::error::Android package is '$actual', expected '$PACKAGE_NAME'"
            exit 1
          fi

      - name: Write Play service account key (runner temp, never committed)
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          # Path must match eas.json submit.production.android.serviceAccountKeyPath (gitignored).
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > ./google-play-service-account.json

      - name: Build AAB on EAS, verify the backend & submit to Play internal
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.KC_EAS_PROJECT_ID }}
          BUILD_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          eas build --platform android --profile nightly --non-interactive --wait --json > build.json
          url="$(jq -r '.[0].artifacts.buildUrl // empty' build.json)"
          [ -n "$url" ] || { echo "::error::No AAB artifact URL from EAS"; exit 1; }
          # Refuse to submit unless the shipped JS bundle points at kc-dev only. The
          # cloud builder also receives EAS server variables, so check the artifact.
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/app.aab" "$url"
          unzip -p "$RUNNER_TEMP/app.aab" 'base/assets/index.android.bundle' > "$RUNNER_TEMP/index.android.bundle"
          node "$GITHUB_WORKSPACE/scripts/mobile-store-config.mjs" verify "$RUNNER_TEMP/index.android.bundle"
          # The versionCode of this very build (EAS remote autoIncrement assigned it).
          version_code="$(jq -r '.[0].appBuildVersion // empty' build.json)"
          [ -n "$version_code" ] || { echo "::error::EAS returned no appBuildVersion (versionCode)"; exit 1; }
          eas submit --platform android --profile production --url "$url" --non-interactive
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Play internal upload: Android versionCode $version_code from $BUILD_SHA (kc-dev backend)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove key file
        if: always()
        working-directory: .
        run: rm -f app/apps/mobile/google-play-service-account.json
