# Google Play internal-track upload: EAS cloud AAB + `eas submit`. Never promotes
# beyond the internal track (eas.json submits a draft with changesNotSentForReview).
#
# Callers: the nightly pipeline (mobile-nightly.yml, `workflow_call` with the
# green SHA) and manual dispatch on dev or main. Either way the commit built must
# have a successful `CI` push run on dev or main (D-195 "Mobile nightly").
#
# Runs in the `mobile-store` GitHub Environment (deployment branches: dev, main).
# Required, fail closed when unset:
#   secrets  EXPO_TOKEN, GOOGLE_PLAY_SERVICE_ACCOUNT_JSON, MOBILE_SUPABASE_ANON_KEY
#   vars     KC_EAS_PROJECT_ID, MOBILE_SUPABASE_TARGET (prod | dev)
# The Supabase backend is pinned from the mobile-store environment into the eas.json
# profile env, which overrides the EAS "production" environment on the cloud builder.
# Sentry DSN / org / URL still come from the EAS "production" environment.
name: Play Internal Android

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to build (must have a successful CI push run on dev or main)
        type: string
        required: true
    outputs:
      version_code:
        description: Android versionCode of the submitted AAB
        value: ${{ jobs.play-internal.outputs.version_code }}
      supabase_target:
        description: Supabase target baked into the build (prod | dev)
        value: ${{ jobs.play-internal.outputs.supabase_target }}
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_NAME: org.karmacommunity.app
  # Same eas-cli pin in testflight-ios.yml and kc-mobile-eas-preview.yml; bump all three together.
  EAS_CLI_VERSION: 24.12.1

jobs:
  play-internal:
    name: Build AAB & submit to Play internal
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: mobile-store
    permissions:
      contents: read
      actions: read # read CI runs to verify the commit is green
    # One Android build at a time across the nightly and manual runs. Never
    # cancel an in-flight build: it has already consumed an EAS versionCode.
    concurrency:
      group: play-internal-android
      cancel-in-progress: false
    outputs:
      version_code: ${{ steps.build.outputs.version_code }}
      supabase_target: ${{ steps.config.outputs.target }}
    defaults:
      run:
        working-directory: app/apps/mobile
    steps:
      - name: Verify the commit passed CI on dev or main
        id: target
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A dispatch builds the dispatched ref's head; a nightly call passes its green SHA.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/dev" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual Play internal runs are allowed only on dev or main (got $GITHUB_REF)."
            exit 1
          fi
          sha="${INPUT_REF:-$GITHUB_SHA}"
          green="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=success" \
            --jq '[.workflow_runs[] | select(.head_branch == "dev" or .head_branch == "main")] | length')"
          if [ "$green" -eq 0 ]; then
            echo "::error::$sha has no successful CI push run on dev or main; refusing to build it."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Preflight secrets (fail closed)
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          MOBILE_SUPABASE_ANON_KEY: ${{ secrets.MOBILE_SUPABASE_ANON_KEY }}
          KC_EAS_PROJECT_ID: ${{ vars.KC_EAS_PROJECT_ID }}
          MOBILE_SUPABASE_TARGET: ${{ vars.MOBILE_SUPABASE_TARGET }}
        run: |
          set -euo pipefail
          missing=()
          for n in EXPO_TOKEN GOOGLE_PLAY_SERVICE_ACCOUNT_JSON MOBILE_SUPABASE_ANON_KEY KC_EAS_PROJECT_ID MOBILE_SUPABASE_TARGET; do
            [ -n "${!n:-}" ] || missing+=("$n")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Play internal cannot run — missing secrets/variables (repo or mobile-store environment): ${missing[*]}"
            exit 1
          fi
          if ! printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" | jq -e '.type == "service_account" and (.client_email|length>0)' >/dev/null; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not a valid service account JSON"
            exit 1
          fi
          echo "All Play internal secrets present."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install EAS CLI
        run: npm install -g "eas-cli@$EAS_CLI_VERSION" --ignore-scripts

      - name: Verify Android package
        run: |
          set -euo pipefail
          actual="$(npx --yes expo config --json --type public | jq -r '.android.package')"
          if [ "$actual" != "$PACKAGE_NAME" ]; then
            echo "::error::Android package is '$actual', expected '$PACKAGE_NAME'"
            exit 1
          fi

      # Bakes the mobile-store backend into the eas.json profile env (runner only).
      - name: Pin the Supabase backend
        id: config
        working-directory: .
        env:
          MOBILE_SUPABASE_TARGET: ${{ vars.MOBILE_SUPABASE_TARGET }}
          MOBILE_SUPABASE_ANON_KEY: ${{ secrets.MOBILE_SUPABASE_ANON_KEY }}
        run: node scripts/mobile-store-config.mjs

      - name: Write Play service account key (runner temp, never committed)
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          # Path must match eas.json submit.production.android.serviceAccountKeyPath (gitignored).
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > ./google-play-service-account.json

      - name: Build AAB on EAS & submit to Play internal
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.KC_EAS_PROJECT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          BUILD_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          [ -n "${SENTRY_AUTH_TOKEN:-}" ] || export SENTRY_DISABLE_AUTO_UPLOAD=true
          eas build --platform android --profile production --non-interactive --wait --json > build.json
          url="$(jq -r '.[0].artifacts.buildUrl // empty' build.json)"
          [ -n "$url" ] || { echo "::error::No AAB artifact URL from EAS"; exit 1; }
          # The versionCode of this very build (EAS remote autoIncrement assigned it).
          version_code="$(jq -r '.[0].appBuildVersion // empty' build.json)"
          [ -n "$version_code" ] || { echo "::error::EAS returned no appBuildVersion (versionCode)"; exit 1; }
          eas submit --platform android --profile production --url "$url" --non-interactive
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Play internal upload: Android versionCode $version_code from $BUILD_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove key file
        if: always()
        working-directory: .
        run: rm -f app/apps/mobile/google-play-service-account.json
