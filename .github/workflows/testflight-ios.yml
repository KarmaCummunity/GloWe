# TestFlight upload: macOS runner + local `eas build` (no EAS cloud build quota),
# then `eas submit`. Uploads to TestFlight only; never submits for App Store review.
#
# Callers: the nightly pipeline (mobile-nightly.yml, `workflow_call` with the
# green SHA) and manual dispatch on dev or main. Either way the commit built must
# have a successful `CI` push run on dev or main (D-195 "Mobile nightly").
#
# Runs in the `mobile-store` GitHub Environment (deployment branches: dev, main).
# Required, fail closed when unset:
#   secrets  EXPO_TOKEN, ASC_API_KEY_ID, ASC_API_KEY_ISSUER_ID, ASC_API_KEY_P8, KC_IOS_TEAM_ID,
#            KC_IOS_DIST_P12_B64, KC_IOS_DIST_P12_PASSWORD, MOBILE_SUPABASE_ANON_KEY
#   vars     KC_ASC_APP_ID (numeric App Store Connect app id), KC_EAS_PROJECT_ID,
#            KC_IOS_DIST_CERT_ID, MOBILE_SUPABASE_TARGET (prod | dev)
# Optional: secret SENTRY_AUTH_TOKEN; vars SENTRY_ORG, SENTRY_URL, EXPO_PUBLIC_SENTRY_DSN, EXPO_PUBLIC_POSTHOG_KEY.
name: TestFlight iOS

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to build (must have a successful CI push run on dev or main)
        type: string
        required: true
    outputs:
      build_number:
        description: CFBundleVersion of the uploaded build
        value: ${{ jobs.testflight.outputs.build_number }}
      supabase_target:
        description: Supabase target baked into the build (prod | dev)
        value: ${{ jobs.testflight.outputs.supabase_target }}
  workflow_dispatch:

permissions:
  contents: read

env:
  BUNDLE_ID: org.karmacommunity.app
  # Same eas-cli pin in play-internal.yml and kc-mobile-eas-preview.yml; bump all three together.
  EAS_CLI_VERSION: 24.12.1

jobs:
  testflight:
    name: Build & upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 90
    environment: mobile-store
    permissions:
      contents: read
      actions: read # read CI runs to verify the commit is green
    # One iOS build at a time across the nightly and manual runs. Never cancel
    # an in-flight build: it has already consumed an EAS build number.
    concurrency:
      group: testflight-ios
      cancel-in-progress: false
    outputs:
      build_number: ${{ steps.build.outputs.build_number }}
      supabase_target: ${{ steps.config.outputs.target }}
    defaults:
      run:
        working-directory: app/apps/mobile
    steps:
      - name: Verify the commit passed CI on dev or main
        id: target
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A dispatch builds the dispatched ref's head; a nightly call passes its green SHA.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/dev" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual TestFlight runs are allowed only on dev or main (got $GITHUB_REF)."
            exit 1
          fi
          sha="${INPUT_REF:-$GITHUB_SHA}"
          green="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=success" \
            --jq '[.workflow_runs[] | select(.head_branch == "dev" or .head_branch == "main")] | length')"
          if [ "$green" -eq 0 ]; then
            echo "::error::$sha has no successful CI push run on dev or main; refusing to build it."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Preflight secrets (fail closed)
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          KC_IOS_TEAM_ID: ${{ secrets.KC_IOS_TEAM_ID }}
          KC_IOS_DIST_P12_B64: ${{ secrets.KC_IOS_DIST_P12_B64 }}
          KC_IOS_DIST_P12_PASSWORD: ${{ secrets.KC_IOS_DIST_P12_PASSWORD }}
          MOBILE_SUPABASE_ANON_KEY: ${{ secrets.MOBILE_SUPABASE_ANON_KEY }}
          KC_ASC_APP_ID: ${{ vars.KC_ASC_APP_ID }}
          KC_EAS_PROJECT_ID: ${{ vars.KC_EAS_PROJECT_ID }}
          KC_IOS_DIST_CERT_ID: ${{ vars.KC_IOS_DIST_CERT_ID }}
          MOBILE_SUPABASE_TARGET: ${{ vars.MOBILE_SUPABASE_TARGET }}
        run: |
          set -euo pipefail
          missing=()
          for n in EXPO_TOKEN ASC_API_KEY_ID ASC_API_KEY_ISSUER_ID ASC_API_KEY_P8 KC_IOS_TEAM_ID \
                   KC_IOS_DIST_P12_B64 KC_IOS_DIST_P12_PASSWORD MOBILE_SUPABASE_ANON_KEY \
                   KC_ASC_APP_ID KC_EAS_PROJECT_ID KC_IOS_DIST_CERT_ID MOBILE_SUPABASE_TARGET; do
            [ -n "${!n:-}" ] || missing+=("$n")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::TestFlight cannot run — missing secrets/variables (repo or mobile-store environment): ${missing[*]}"
            exit 1
          fi
          echo "All TestFlight secrets present."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install EAS CLI
        run: npm install -g "eas-cli@$EAS_CLI_VERSION" --ignore-scripts

      - name: Verify bundle identifier
        run: |
          set -euo pipefail
          actual="$(npx --yes expo config --json --type public | jq -r '.ios.bundleIdentifier')"
          if [ "$actual" != "$BUNDLE_ID" ]; then
            echo "::error::iOS bundleIdentifier is '$actual', expected '$BUNDLE_ID'"
            exit 1
          fi

      # Bakes the mobile-store backend into the eas.json profile env (runner only).
      - name: Pin the Supabase backend
        id: config
        working-directory: .
        env:
          MOBILE_SUPABASE_TARGET: ${{ vars.MOBILE_SUPABASE_TARGET }}
          MOBILE_SUPABASE_ANON_KEY: ${{ secrets.MOBILE_SUPABASE_ANON_KEY }}
        run: node scripts/mobile-store-config.mjs

      - name: Write ASC API key (runner temp, never committed)
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc-api-key.p8"

      - name: Create signing credentials via ASC API (runner only)
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          KC_IOS_DIST_P12_B64: ${{ secrets.KC_IOS_DIST_P12_B64 }}
          KC_IOS_DIST_P12_PASSWORD: ${{ secrets.KC_IOS_DIST_P12_PASSWORD }}
          KC_IOS_DIST_CERT_ID: ${{ vars.KC_IOS_DIST_CERT_ID }}
        run: |
          set -euo pipefail
          umask 077
          sd="$RUNNER_TEMP/sign"; mkdir -p "$sd"
          printf '%s' "$KC_IOS_DIST_P12_B64" | base64 --decode > "$sd/dist.p12"
          gem list -i fastlane >/dev/null || sudo gem install fastlane --no-document >/dev/null
          ruby -rspaceship -e1 2>/dev/null || sudo gem install fastlane --no-document >/dev/null
          ruby "$GITHUB_WORKSPACE/.github/scripts/ios-signing.rb" "$sd"
          pw="$KC_IOS_DIST_P12_PASSWORD"
          jq -n --arg p "$sd/kc.mobileprovision" --arg c "$sd/dist.p12" --arg pw "$pw" \
            '{ios:{provisioningProfilePath:$p,distributionCertificate:{path:$c,password:$pw}}}' > credentials.json
          tmp="$(mktemp)"; jq '.build.production.ios.credentialsSource = "local"' eas.json > "$tmp" && mv "$tmp" eas.json

      - name: Build iOS locally & upload to TestFlight
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.KC_IOS_TEAM_ID }}
          ASC_APP_ID: ${{ vars.KC_ASC_APP_ID }}
          EAS_PROJECT_ID: ${{ vars.KC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.EXPO_PUBLIC_POSTHOG_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          BUILD_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          [ -n "${SENTRY_AUTH_TOKEN:-}" ] || export SENTRY_DISABLE_AUTO_UPLOAD=true
          eas build --platform ios --profile production --local --non-interactive --output ./build-kc.ipa
          # The build number actually inside the IPA (EAS remote autoIncrement assigned it).
          unzip -p ./build-kc.ipa 'Payload/*.app/Info.plist' > "$RUNNER_TEMP/Info.plist"
          build_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/Info.plist")"
          [ -n "$build_number" ] || { echo "::error::Could not read CFBundleVersion from the IPA"; exit 1; }
          # eas.json keeps a placeholder (public repo); inject the real ASC app id on the runner only.
          tmp="$(mktemp)"; jq --arg id "$ASC_APP_ID" --arg k "$EXPO_ASC_API_KEY_PATH" --arg kid "$EXPO_ASC_KEY_ID" --arg iss "$EXPO_ASC_ISSUER_ID" '.submit.production.ios += {ascAppId: $id, ascApiKeyPath: $k, ascApiKeyId: $kid, ascApiKeyIssuerId: $iss}' eas.json > "$tmp" && mv "$tmp" eas.json
          eas submit --platform ios --profile production --path ./build-kc.ipa --non-interactive
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "TestFlight upload: iOS build $build_number from $BUILD_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove key files
        if: always()
        working-directory: .
        run: rm -rf "$RUNNER_TEMP/asc-api-key.p8" "$RUNNER_TEMP/sign" app/apps/mobile/credentials.json
