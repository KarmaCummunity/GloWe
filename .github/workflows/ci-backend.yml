name: CI — backend

# Database lane, called by ci.yml when migrations, seed/config, the Supabase
# adapter package or CI plumbing changed. Boots a fresh local Supabase stack
# (all migrations + seed.sql), then runs every supabase/tests/*.sql file
# (incl. rls-lint.sql), the database.types.ts drift check and the SECURITY
# DEFINER SQL probe integration tests. The migration chain and destructive-op
# scans are static and run in ci-static-guards.yml.

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  db-validate:
    name: apply migrations · rls · types · sql probes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Supabase CLI (version pinned in the composite action)
        uses: ./.github/actions/setup-supabase-cli

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Log in to ghcr.io (authenticated image pulls avoid anonymous rate limits)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Start Supabase (applies all migrations + seed.sql)
        run: |
          # Image pulls hit registry rate limits intermittently (`toomanyrequests`
          # on ghcr.io, `Data limit exceeded` on public.ecr.aws) — infra, not a
          # code error — so rotate registries before giving up.
          for reg in docker.io public.ecr.aws ghcr.io docker.io; do
            export SUPABASE_INTERNAL_IMAGE_REGISTRY=$reg
            timeout 300 supabase start -x studio,inbucket,imgproxy,edge-runtime,realtime,storage-api && exit 0
            echo "::warning::supabase start via $reg failed, trying next registry"
            supabase stop --no-backup >/dev/null 2>&1 || true
            sleep 30
          done
          exit 1

      - name: Run all DB tests (harness + supabase/tests + flows)
        # Same runner agents use locally: installs supabase/tests/_harness, then runs the
        # per-migration tests and the per-world lifecycle flows (G44).
        run: scripts/run-db-tests.sh

      - name: Check database.types.ts drift
        run: |
          set -euo pipefail
          supabase gen types typescript --local > /tmp/database.types.ts
          if ! diff -u app/packages/infrastructure-supabase/src/database.types.ts /tmp/database.types.ts; then
            echo "::error::database.types.ts is out of date. Run: supabase gen types typescript --local > app/packages/infrastructure-supabase/src/database.types.ts"
            exit 1
          fi

      # Node 22 is deliberate (sqlProbes need native WebSocket; do not use .nvmrc).
      - name: Setup pnpm + Turbo cache (Node 22)
        uses: ./.github/actions/setup-pnpm-turbo
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: app
        env:
          TURBO_TELEMETRY_DISABLED: '1'
        run: pnpm install --frozen-lockfile

      - name: SQL probe integration tests (against local stack)
        working-directory: app
        env:
          CI_LOCAL_SUPABASE: 'true'
        run: pnpm --filter @kc/infrastructure-supabase test sqlProbes

      - name: Stop Supabase
        if: always()
        run: supabase stop || true
