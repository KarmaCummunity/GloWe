name: CI — backend

# Backend correctness gate. Boots a fresh Supabase local stack and runs all DB
# tests (incl. rls-lint.sql), the database.types.ts drift check, and the
# SECURITY DEFINER SQL probe integration tests.
#
# `apply migrations · rls · types · sql probes` is a REQUIRED status check on
# `dev` / `main`, so it MUST report on every non-draft PR — including PRs that
# don't touch the backend. Path-filtering the workflow at the `on:` level left
# that required check permanently "Expected" on FE/docs/domain-only PRs and
# blocked their merge. Instead the workflow now runs unconditionally and a cheap
# `changes` job gates the heavy steps: non-backend PRs get a fast pass; backend
# PRs boot the full local stack. Keep the `changes` filter list in sync with the
# heavy job's real inputs.

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, dev]
    paths:
      - 'supabase/**'
      - 'scripts/check-migration-chain.mjs'
      - 'app/packages/infrastructure-supabase/src/database.types.ts'
      - 'app/packages/infrastructure-supabase/src/rpc/__tests__/sqlProbes.integration.test.ts'
      - '.github/workflows/ci-backend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  packages: read

jobs:
  changes:
    name: detect backend changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect backend-relevant changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'supabase/**'
              - 'scripts/check-migration-chain.mjs'
              - 'app/packages/infrastructure-supabase/src/database.types.ts'
              - 'app/packages/infrastructure-supabase/src/rpc/__tests__/sqlProbes.integration.test.ts'
              - 'supabase/functions/**'
              - '.github/workflows/ci-backend.yml'

  migration-chain:
    name: migration chain lint
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verify Alembic-style single-head migration chain
        run: node scripts/check-migration-chain.mjs


  whatsapp-deno:
    name: WhatsApp edge unit + e2e (Deno)
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno test WhatsApp handlers (mocked Meta, no secrets)
        working-directory: supabase/functions
        run: deno test _shared/whatsapp whatsapp-webhook whatsapp-sender _shared/matching match-rerank --allow-read

  db-validate:
    # REQUIRED status check — always runs so the context reports on every PR.
    # Heavy steps are gated on `needs.changes.outputs.backend == 'true'`; a
    # non-backend PR runs only the skip-notice step and concludes success.
    name: apply migrations · rls · types · sql probes
    needs: changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: No backend changes — DB validation not required
        if: needs.changes.outputs.backend != 'true'
        run: echo "No supabase/** or backend-input changes in this PR — skipping DB validation."

      - name: Checkout
        if: needs.changes.outputs.backend == 'true'
        uses: actions/checkout@v6

      - name: Install Supabase CLI
        if: needs.changes.outputs.backend == 'true'
        uses: supabase/setup-cli@v3
        with:
          # Keep in sync with db-deploy.yml — bump both in the same PR.
          version: 2.99.0

      - name: Print Supabase CLI version
        if: needs.changes.outputs.backend == 'true'
        run: supabase --version

      - name: Install psql client
        if: needs.changes.outputs.backend == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Log in to ghcr.io (authenticated image pulls avoid anonymous rate limits)
        if: needs.changes.outputs.backend == 'true'
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Supabase (applies all migrations + seed.sql)
        if: needs.changes.outputs.backend == 'true'
        # Retry: image pulls from the public registry intermittently fail with
        # `toomanyrequests` (registry rate limit), which is infra, not a code error.
        run: |
          # ghcr.io has been returning `toomanyrequests` even for authenticated pulls;
          # pull the same Supabase images from the public ECR mirror instead.
          export SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws
          for i in 1 2 3 4; do
            supabase start -x studio,inbucket,imgproxy,edge-runtime,realtime,storage-api && exit 0
            echo "::warning::supabase start failed (attempt $i), retrying in $((i*45))s"
            supabase stop --no-backup >/dev/null 2>&1 || true
            sleep $((i*45))
          done
          exit 1

      - name: Run all DB tests (supabase/tests/*.sql)
        if: needs.changes.outputs.backend == 'true'
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in supabase/tests/*.sql; do
            echo "── Running $f ──"
            psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
              -v ON_ERROR_STOP=1 \
              -f "$f"
          done

      - name: Check database.types.ts drift
        if: needs.changes.outputs.backend == 'true'
        run: |
          set -euo pipefail
          supabase gen types typescript --local > /tmp/database.types.ts
          if ! diff -u app/packages/infrastructure-supabase/src/database.types.ts /tmp/database.types.ts; then
            echo "::error::database.types.ts is out of date. Run: supabase gen types typescript --local > app/packages/infrastructure-supabase/src/database.types.ts"
            exit 1
          fi

      # Node 22 is deliberate (sqlProbes need native WebSocket; do not use .nvmrc).
      - name: Setup pnpm + Turbo cache (Node 22)
        if: needs.changes.outputs.backend == 'true'
        uses: ./.github/actions/setup-pnpm-turbo
        with:
          node-version: '22'

      - name: Install dependencies
        if: needs.changes.outputs.backend == 'true'
        working-directory: app
        env:
          TURBO_TELEMETRY_DISABLED: '1'
        run: pnpm install --frozen-lockfile

      - name: SQL probe integration tests (against local stack)
        if: needs.changes.outputs.backend == 'true'
        working-directory: app
        env:
          CI_LOCAL_SUPABASE: 'true'
        run: pnpm --filter @kc/infrastructure-supabase test sqlProbes

      - name: Stop Supabase
        if: always() && needs.changes.outputs.backend == 'true'
        run: supabase stop || true
