# SonarCloud — KarmaCummunity/KC
# Dashboard: https://sonarcloud.io/project/overview?id=KarmaCummunity_MVP-2
sonar.projectKey=KarmaCummunity_MVP-2
sonar.organization=karmacummunity

sonar.sources=app
sonar.tests=app
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.test.mjs
sonar.exclusions=**/node_modules/**,**/.expo/**,**/dist/**,**/coverage/**,**/.turbo/**,**/build/**,**/public/**,**/database.types.ts,**/*.d.ts

# i18n locale bundles are structurally parallel by design: every language mirrors
# the same key tree and only the string values differ, and the composition roots
# (`he/index.ts`, `en/index.ts`) share the same import/object shape. That is not
# copy-paste debt, so exclude the locale trees from duplication detection
# (added for FR-SETTINGS-018 / D-24 — the English bundle mirrors Hebrew).
sonar.cpd.exclusions=app/apps/mobile/src/i18n/locales/**

# Monorepo TS — analysis rooted at app/
sonar.sourceEncoding=UTF-8

# Coverage — vitest writes lcov.info per package via `pnpm test:coverage`.
# Paths are repo-root relative; ci-sonar.yml downloads them from the frontend tests job.
sonar.javascript.lcov.reportPaths=app/packages/domain/coverage/lcov.info,app/packages/application/coverage/lcov.info,app/packages/infrastructure-supabase/coverage/lcov.info,app/packages/ui/coverage/lcov.info,app/apps/mobile/coverage/lcov.info
sonar.typescript.lcov.reportPaths=app/packages/domain/coverage/lcov.info,app/packages/application/coverage/lcov.info,app/packages/infrastructure-supabase/coverage/lcov.info,app/packages/ui/coverage/lcov.info,app/apps/mobile/coverage/lcov.info
# Coverage scope: gate `packages/**` + `apps/mobile/src/{lib,hooks,store}/**`,
# where vitest already covers the testable code (≈1400 passing tests, TD-31).
# React Native screens/components/features stay excluded until TD-150 lands an
# (`src/screens/**` holds screen bodies moved out of expo-router `app/`, TD-195)
# RNTL/jest-expo harness (`@kc/mobile` has no UI test runner today). The mobile
# DI plumbing (`*Composition.ts`, `devAutoSignIn`) is structural wiring with no
# branches worth asserting. `app/scripts/**` are build/release glue scripts
# (e.g. web-postbuild.mjs) with no unit-test harness — excluded for the same
# reason. Stories / Expo app config / EAS config are also excluded (issue #944).
sonar.coverage.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.test.mjs,**/*.stories.*,**/*.stories.tsx,**/*.config.ts,**/*.config.js,**/*.config.mjs,**/database.types.ts,**/*.d.ts,**/index.ts,app/scripts/**,app/apps/mobile/web-server/**,app/apps/mobile/app.config.ts,app/apps/mobile/app.json,app/apps/mobile/eas.json,app/apps/mobile/src/i18n/**,app/apps/mobile/app/**,app/apps/mobile/src/screens/**,app/apps/mobile/src/components/**,app/apps/mobile/src/features/**,app/apps/mobile/src/hooks/**,app/apps/mobile/src/lib/**,app/apps/mobile/src/services/*Composition.ts,app/apps/mobile/src/services/devAutoSignIn.ts

# CI: block the workflow when the Quality Gate fails (new code on PRs).
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
