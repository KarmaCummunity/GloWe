<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - GloWe</title>
    <link rel="icon" type="image/png" href="../assets/glowe-favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="GloWe">
    <script src="../js/glowe-auth-paint.js"></script>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="opportunities-page-body">
    <header class="main-header">
        <div class="container">
            <a href="../index.html" class="logo">
                <span class="logo-icon"></span>
                <span class="logo-text">GloWe</span>
            </a>
            <nav class="main-nav"></nav>
            <div class="auth-buttons"></div>
            <div class="user-menu" style="display: none;"></div>
        </div>
    </header>

    <main>
        <section class="page-header personal-area-header">
            <div class="container">
                <h1>Settings</h1>
                <p>Manage your account, language, and session preferences.</p>
            </div>
        </section>

        <section class="personal-area-page">
            <div class="container">
                <div id="settings-content">
                    <!-- Populated by JavaScript -->
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>2026 GloWe. Built for shared knowledge, mutual support, and action that lasts.</p>
            </div>
        </div>
    </footer>

    <!-- Success Modal -->
    <div id="success-modal" class="modal">
        <div class="modal-content modal-success">
            <span class="success-icon">GloWe</span>
            <h2 id="success-title">Success</h2>
            <p id="success-message">Your action was completed successfully.</p>
            <button class="btn btn-primary" onclick="closeModal('success-modal')">Continue</button>
        </div>
    </div>

    <script src="../js/backend-config.js" defer></script>
    <script src="../js/glowe-dev-auth.js" defer></script>
    <script src="../js/backend.js" defer></script>
    <script src="../js/data.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/glowe-events.js" defer></script>
    <script src="../js/glowe-organizations.js" defer></script>
    <script src="../js/glowe-wishes.js" defer></script>
    <script src="../js/glowe-moderation.js" defer></script>
    <script src="../js/glowe-create.js" defer></script>
    <script src="../js/glowe-messages.js" defer></script>
    <script src="../js/glowe-guest.js" defer></script>
    <script src="../js/glowe-localized-name.js" defer></script>
    <script src="../js/glowe-ui-conventions.js" defer></script>
    <script src="../js/glowe-version.js" defer></script>
        <script src="../js/glowe-observability.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/glowe-session-cache.js" defer></script>
    <script src="../js/glowe-translate.js" defer></script>
