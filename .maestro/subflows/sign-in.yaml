# Signs in a kc-dev seed user by email and waits for the home feed.
# Env: KC_E2E_EMAIL (default user1@seed.kc.test), KC_E2E_PASSWORD (from scripts/maestro-dev-env.mjs).
appId: org.karmacommunity.app
env:
  KC_E2E_EMAIL: user1@seed.kc.test
---
- runFlow: open-email-sign-in.yaml
- tapOn:
    id: auth-email
- inputText: ${KC_E2E_EMAIL}
- tapOn:
    id: auth-password
- inputText: ${KC_E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: auth-submit
- runFlow: dismiss-gates.yaml
- extendedWaitUntil:
    visible:
      id: feed-screen
    timeout: 45000
