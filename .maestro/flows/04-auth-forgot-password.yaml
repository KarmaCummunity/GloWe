# "Forgot password" opens the reset-request form.
# Spec: docs/SSOT/spec/01_auth_and_onboarding.md FR-AUTH-008 (G36).
appId: org.karmacommunity.app
name: Auth — forgot password opens the reset form
tags: [auth]
---
- runFlow: ../subflows/open-email-sign-in.yaml
- tapOn:
    id: auth-forgot-password
- assertVisible:
    id: forgot-password-email
- assertVisible:
    id: forgot-password-submit
