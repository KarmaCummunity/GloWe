# A wrong password keeps the user signed out on the sign-in form.
# Spec: docs/SSOT/spec/01_auth_and_onboarding.md FR-AUTH-002 (uniform auth failure, D-22).
appId: org.karmacommunity.app
name: Auth — wrong password stays signed out
tags: [auth]
env:
  KC_E2E_EMAIL: user1@seed.kc.test
---
- runFlow: ../subflows/open-email-sign-in.yaml
- tapOn:
    id: auth-email
- inputText: ${KC_E2E_EMAIL}
- tapOn:
    id: auth-password
- inputText: definitely-wrong-password
- hideKeyboard
- tapOn:
    id: auth-submit
- assertVisible:
    id: auth-submit
- assertNotVisible:
    id: feed-screen
