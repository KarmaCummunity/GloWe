# The feed lists posts and a post opens its detail screen.
# Spec: docs/SSOT/spec/06_feed_and_search.md FR-FEED-001; docs/SSOT/spec/04_posts.md (post detail).
appId: org.karmacommunity.app
name: Feed — open a post from the feed
tags: [feed, smoke]
---
- runFlow: ../subflows/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: feed-post-card
    timeout: 30000
- tapOn:
    id: feed-post-card
    index: 0
- extendedWaitUntil:
    visible:
      id: post-detail-screen
    timeout: 20000
- back
- assertVisible:
    id: feed-screen
