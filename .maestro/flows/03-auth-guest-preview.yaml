# Guest preview opens the read-only feed without an account.
# Spec: docs/SSOT/spec/01_auth_and_onboarding.md FR-AUTH-001 AC3, FR-AUTH-014.
appId: org.karmacommunity.app
name: Auth — guest preview opens the guest feed
tags: [auth, smoke]
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: ../subflows/dismiss-gates.yaml
- extendedWaitUntil:
    visible:
      id: auth-guest-preview
    timeout: 30000
- tapOn:
    id: auth-guest-preview
- extendedWaitUntil:
    visible:
      id: guest-feed-screen
    timeout: 20000
