# Every bottom tab opens its screen and the tab bar stays docked.
# Spec: docs/SSOT/spec/14_responsive_desktop.md FR-RESP-001 (5 tabs, D-16); docs/spec/04_product_structure.md.
appId: org.karmacommunity.app
name: Shell — all five tabs open
tags: [shell, smoke]
---
- runFlow: ../subflows/sign-in.yaml
- tapOn:
    id: tab-profile
- extendedWaitUntil:
    visible:
      id: my-profile-screen
    timeout: 15000
- tapOn:
    id: tab-search
- extendedWaitUntil:
    visible:
      id: search-screen
    timeout: 15000
- tapOn:
    id: tab-create
- extendedWaitUntil:
    visible:
      id: create-post-screen
    timeout: 15000
- tapOn:
    id: tab-donations
- extendedWaitUntil:
    visible:
      id: donations-hub
    timeout: 15000
- tapOn:
    id: tab-home
- extendedWaitUntil:
    visible:
      id: feed-screen
    timeout: 15000
- assertVisible:
    id: shell-tab-bar
