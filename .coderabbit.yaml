# CodeRabbit — AI PR review (non-merging), installed on KarmaCummunity/KC.
# Reviews the KC app, backend and scripts. (The former GloWe web tree was
# removed in 0238 / D-190, so it is no longer a review target.)
# https://github.com/apps/coderabbitai

language: en-US
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  path_filters:
    - "app/**"
    - "supabase/**"
    - "scripts/**"
    - "docs/spec/**"
    - "CONTRIBUTING.md"
    - "README.md"
    - "!**/*.lock"
    - "!**/pnpm-lock.yaml"
    - "!**/coverage/**"
    - "!**/database.types.ts"
  auto_review:
    enabled: true
    drafts: false
